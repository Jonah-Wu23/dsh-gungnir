# dsh-gungnir bundle patch: mount the Gungnir plugin itself. Rows are
# addressed by id; the user's profile cordis.patch.yml wins last write per row.
#
# v0.1.2 note (ADR-0011 adapter point 3, boot-verified): the dsh-base bundle
# already mounts `storage` + `storage-json` (root dshHomePath('storages')) +
# `storage-domain`. Re-inserting those ids here fails the whole boot with
# "duplicate loader entry id: storage", so this patch only adds the plugin row;
# the ledger rides on the host-provided storage hub via ctx.storage (ADR-0006).

- insert:
    - id: gungnir
      name: dsh-gungnir
      config:
        maxGoalRounds: 64
